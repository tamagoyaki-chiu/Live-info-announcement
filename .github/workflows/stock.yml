name: TW stock report

# 排程已停用（GitHub 排程延遲太久）。程式保留，需要時可手動執行或重新加回 schedule。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: open 或 close
        type: choice
        options: [open, close]
        default: close

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send report
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: node stock.js "${{ inputs.mode }}"
